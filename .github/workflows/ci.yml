name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: azure/setup-helm@v4
      - uses: docker/setup-buildx-action@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: helm lint charts/readest-obsidian-sync
      - run: >-
          helm template test charts/readest-obsidian-sync
          --set aws.region=eu-west-2
          --set aws.sqsQueueUrl=https://example.invalid/queue
          --set aws.s3Bucket=example
      - run: terraform fmt -check -recursive infra/
        working-directory: .
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
      - run: docker buildx build --platform linux/amd64,linux/arm64 --output type=oci,dest=/tmp/readest-obsidian-sync.tar .
