name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/readest-obsidian-sync
  CHART_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:0.1.0-main.${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR for Helm
        run: helm registry login "$REGISTRY" --username "${GITHUB_ACTOR}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and publish Helm chart
        env:
          VERSION: 0.1.0-main.${{ github.sha }}
        run: |
          helm package charts/readest-obsidian-sync \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm push "readest-obsidian-sync-${VERSION}.tgz" "$CHART_REPOSITORY"
