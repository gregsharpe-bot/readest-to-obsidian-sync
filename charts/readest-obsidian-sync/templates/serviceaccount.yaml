{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "readest-obsidian-sync.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "readest-obsidian-sync.name" . }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
