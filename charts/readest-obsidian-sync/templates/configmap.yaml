{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (include "readest-obsidian-sync.fullname" .) .Values.configMap.name }}
  labels:
    app.kubernetes.io/name: {{ include "readest-obsidian-sync.name" . }}
data:
  {{- toYaml .Values.configMap.data | nindent 2 }}
{{- end }}
